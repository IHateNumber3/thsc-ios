name: Compile AS3 to SWF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download bundle.zip from Release (Defending)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download Defending -p "bundle.zip" --dir .
        mkdir -p src
        unzip -q bundle.zip -d src

    - name: Set up Java (Required for Flex SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Download and Setup Apache Flex SDK
      run: |
        wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
        mkdir -p flex-sdk
        tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz -C flex-sdk

    - name: Compile ActionScript to SWF
      run: |
        MXMLC_PATH=$(find flex-sdk -name "mxmlc" -type f)
        
        if [ -z "$MXMLC_PATH" ]; then
          echo "Помилка: mxmlc не знайдено!"
          exit 1
        fi
        
        echo "Використовуємо компилятор: $MXMLC_PATH"
        chmod +x "$MXMLC_PATH"

        PLAYERGLOBAL_DIR="flex-sdk/apache-flex-sdk-4.16.1-bin/frameworks/libs/player/27.0"
        mkdir -p "$PLAYERGLOBAL_DIR"
        
        # Видаляємо старий кривий файл, якщо він залишився
        rm -f "$PLAYERGLOBAL_DIR/playerglobal.swc"
        
        # Скачуємо реальний бінарний playerglobal.swc з робочого дзеркала
        wget -O "$PLAYERGLOBAL_DIR/playerglobal.swc" https://github.com/nyxi/flex-sdk/raw/master/frameworks/libs/player/27.0/playerglobal.swc
        
        # Перевіряємо, що скачався саме бінарник (а не HTML-заглушка), файл має бути великим (>1МБ)
        ls -lh "$PLAYERGLOBAL_DIR/playerglobal.swc"

        # Компілюємо Main.as в готовий game.swf
        "$MXMLC_PATH" \
          -source-path src \
          -output game.swf \
          src/Main.as

    - name: Upload compiled SWF
      uses: actions/upload-artifact@v4
      with:
        name: compiled-game-swf
        path: game.swf
