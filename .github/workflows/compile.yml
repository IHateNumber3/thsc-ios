name: Build SWF Bundle from Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Нужно для скачивания из релиза

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Download bundle.zip from Release (Defending)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Скачиваем конкретный архив bundle.zip из релиза Defending
        gh release download Defending -p "bundle.zip" --dir .
        
        # Распаковываем в папку out для скрипта
        mkdir -p out extracted_out
        unzip -q bundle.zip -d extracted_out
        
        if [ -d "extracted_out/out" ]; then
          cp -r extracted_out/out/* out/
        else
          cp -r extracted_out/* out/
        fi

    - name: Run conversion script
      run: |
        python3 0convert.py

    - name: Upload generated SWF
      uses: actions/upload-artifact@v4
      with:
        name: bundle-swf
        path: bundle.swf
