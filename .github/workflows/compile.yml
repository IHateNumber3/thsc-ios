name: Compile AS3 to SWF with Assets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download assets and SDK from Release (Defending)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Скачуємо bundle.zip та Flex SDK напряму з релізу Defending..."
        gh release download Defending -p "bundle.zip" --dir .
        gh release download Defending -p "apache-flex-sdk-4.16.1-bin.tar.gz" --dir .
        
        mkdir -p src
        unzip -q bundle.zip -d extracted_bundle
        
        mkdir -p flex-sdk
        tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz -C flex-sdk

    - name: Set up Java (Required for Flex SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Compile ActionScript and Embed All Assets into SWF
      run: |
        MXMLC_PATH=$(find flex-sdk -name "mxmlc" -type f)
        
        if [ -z "$MXMLC_PATH" ]; then
          echo "Помилка: mxmlc не знайдено!"
          exit 1
        \fi
        
        echo "Використовуємо компилятор: $MXMLC_PATH"
        chmod +x "$MXMLC_PATH"

        PLAYERGLOBAL_DIR="flex-sdk/apache-flex-sdk-4.16.1-bin/frameworks/libs/player/27.0"
        mkdir -p "$PLAYERGLOBAL_DIR"
        
        rm -f "$PLAYERGLOBAL_DIR/playerglobal.swc"
        wget -O "$PLAYERGLOBAL_DIR/playerglobal.swc" https://raw.githubusercontent.com/nexussays/playerglobal/master/27.0/playerglobal.swc
        
        ABS_PATH="$(pwd)/$PLAYERGLOBAL_DIR"
        CONFIG_PATH="flex-sdk/apache-flex-sdk-4.16.1-bin/frameworks/flex-config.xml"
        
        python3 -c "
        with open('$CONFIG_PATH', 'r') as f:
            content = f.read()
        import re
        content = re.sub(r'<external-library-path>.*?</external-library-path>', '<external-library-path/>', content, flags=re.DOTALL)
        content = re.sub(r'<library-path>.*?</library-path>', '<library-path/>', content, flags=re.DOTALL)
        with open('$CONFIG_PATH', 'w') as f:
            f.write(content)
        "

        MAIN_AS_PATH=$(find extracted_bundle -name "Main.as" -type f | head -n 1)
        if [ -z "$MAIN_AS_PATH" ]; then
          echo "ПОМИЛКА: Не знайдено Main.as!"
          exit 1
        fi
        SRC_DIR=$(dirname "$MAIN_AS_PATH")
        BUNDLE_ROOT=$(dirname "$SRC_DIR")

        echo "Знайдено вихідники у: $SRC_DIR"
        echo "Коренева папка з ресурсами: $BUNDLE_ROOT"

        # ДЕБАГ: Виводимо довідку компілятора щодо роботи з файлами перед збіркою
        echo "=== ДОБІРКА СПРАВКИ MXMLC ==="
        "$MXMLC_PATH" -help syntax | head -n 30 || true

        # Компилируем Main.as с подключением папки через source-path или library-path
        "$MXMLC_PATH" \
          -source-path "$SRC_DIR" \
          -output game.swf \
          -external-library-path+="$ABS_PATH/playerglobal.swc" \
          "$MAIN_AS_PATH"

    - name: Upload fully packed SWF
      uses: actions/upload-artifact@v4
      with:
        name: compiled-game-swf
        path: game.swf
