name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем готовый архив AIR SDK под macOS напрямую из Github Релизов
      - name: Setup Harman AIR SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p air_sdk_folder
          
          # Скачиваем архив AIR SDK для macOS с GitHub релизов Harman
          gh release download --repo airsdk/apm --pattern "*mac*.zip" --clobber || \
          gh release download --repo airsdk/apm --pattern "*.zip" --clobber
          
          # Распаковываем
          unzip -q *.zip -d air_sdk_folder
          
          # Находим папки с SDK/adt и прописываем права
          chmod -R +x ./air_sdk_folder/
          
          # Добавляем пути к adt в PATH
          ADT_BIN=$(find "$GITHUB_WORKSPACE/air_sdk_folder" -name "adt" -type f | head -n 1)
          if [ -n "$ADT_BIN" ]; then
            echo "$(dirname "$ADT_BIN")" >> $GITHUB_PATH
          fi

      # Шаг 2: Скачиваем SWF ассеты из вашего релиза
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
