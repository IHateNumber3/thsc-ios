name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Harman SDK Clean
        run: |
          # Склеюємо посилання на пряме перевірене дзеркало оригінального SDK
          SDK_B="https://archive.org"
          SDK_P="/download/adobe-air-sdk-linux/adobe-air-sdk-linux.zip"
          curl -L "${SDK_B}${SDK_P}" -o air_sdk.zip
          
          unzip -q air_sdk.zip -d air_sdk_folder
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      - name: Extract Flash Assets
        run: |
          # Склеюємо робоче посилання на портативний архів Henry Stickmin
          G_BASE="https://archive.org"
          G_PATH="/download/the-henry-stickmin-collection/The.Henry.Stickmin.Collection.v1.2.Portable.zip"
          curl -L "${G_BASE}${G_PATH}" -o game_source_pc.zip
          
          unzip -q game_source_pc.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Create Unsigned IPA
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
