name: Build Henry Stickmin iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install AIR SDK Manager
        run: |
          # Качаємо офіційний менеджер релізів HARMAN з GitHub
          wget --no-check-certificate 'https://github.com' -O manager.zip
          unzip -q manager.zip -d manager_folder
          chmod +x manager_folder/airsdkmanager
          
          # Запускаємо менеджер, щоб він сам чисто скачав останню стабільну версію SDK
          ./manager_folder/airsdkmanager --install --path="$GITHUB_WORKSPACE/air_sdk_folder"
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      - name: Fetch Clean Game Files
        run: |
          wget --no-check-certificate 'https://archive.org' -O game_source_pc.zip
          unzip -q game_source_pc.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Packaging iOS App
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Distribute Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
