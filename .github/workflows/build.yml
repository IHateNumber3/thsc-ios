name: Build Henry Stickmin iOS App

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      # 1. Скачиваем SWF ассеты из релизов
      - name: Fetch SWF Assets
        run: |
          mkdir -p WebAssets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o WebAssets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o WebAssets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o WebAssets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o WebAssets/HenryCtM2.swf

      # 2. Собираем исполняемый файл через SwiftPM под ARM64 (iOS Device)
      - name: Build Executable via SwiftPM
        run: |
          swift build -c release \
            --triple arm64-apple-ios14.0-sdk \
            -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphoneos --show-sdk-path)

      # 3. Формируем легитимный .app бандл и Payload
      - name: Assemble Payload Bundle
        run: |
          rm -rf Payload HenryStickmin.app
          mkdir -p Payload/HenryStickmin.app

          # Копируем скомпилированный бинарник
          BUILD_BIN=$(swift build -c release --triple arm64-apple-ios14.0-sdk --show-bin-path)/HenryStickmin
          cp "$BUILD_BIN" Payload/HenryStickmin.app/HenryStickmin

          # Копируем ассеты
          cp -R WebAssets Payload/HenryStickmin.app/

          # Создаём валидный Info.plist
          cat << 'EOF' > Payload/HenryStickmin.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HenryStickmin</string>
              <key>CFBundleIdentifier</key>
              <string>com.henry.stickmin</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Henry Stickmin</string>
              <key>CFBundleDisplayName</key>
              <string>Henry Stickmin</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          EOF

      # 4. Подпись Ad-Hoc и упаковывание в IPA
      - name: Package IPA
        run: |
          codesign --force --sign - --timestamp=none Payload/HenryStickmin.app
          zip -r HenryStickmin-native.ipa Payload

      # 5. Выгрузка артефакта
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
