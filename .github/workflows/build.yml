name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем, распаковываем Flex SDK и инспектируем файлы
      - name: Inspect Flex SDK Structure & Set Path
        run: |
          mkdir -p air_sdk_folder
          curl -sSL "https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip" -o flex_sdk.zip
          unzip -q flex_sdk.zip -d air_sdk_folder
          
          echo "=== Поиск всех исполняемых файлов adt и папок bin ==="
          find air_sdk_folder -name "adt*" -o -name "bin"
          
          echo "=== Дерево файлов первого уровня в air_sdk_folder ==="
          ls -la air_sdk_folder
          
          # Ищем реальный путь к adt
          ADT_PATH=$(find "$GITHUB_WORKSPACE/air_sdk_folder" -name "adt" -type f | head -n 1)
          
          if [ -n "$ADT_PATH" ]; then
            ADT_DIR=$(dirname "$ADT_PATH")
            chmod -R +x "$ADT_DIR"
            echo "$ADT_DIR" >> $GITHUB_PATH
            echo "REAL_ADT_PATH=$ADT_PATH" >> $GITHUB_ENV
            echo "Found ADT at: $ADT_PATH"
          else
            echo "ADT executable not found in zip!"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Запуск сборки ipa через найденный adt
      - name: Package iOS App
        run: |
          "$REAL_ADT_PATH" -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
