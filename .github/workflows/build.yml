name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем архив AIR SDK прямо из проверенного GitHub Mirror
      - name: Download Harman AIR SDK from GitHub Mirror
        run: |
          mkdir -p air_sdk_folder
          
          # Скачиваем официальный архив AIR SDK для macOS с GitHub
          curl -sSL -o air_sdk.zip "https://github.com/airsdk/airsdkmanager-releases/releases/download/v1.4.0/AIRSDK_macOS.zip" || \
          curl -sSL -o air_sdk.zip "https://github.com/Joshtyn/air-sdk-releases/releases/download/51.0.1.1/AIRSDK_macOS.zip"
          
          # Если первая ссылка не подошла, выкачиваем со стабильного зеркала 50.2/51.x
          if [ ! -s air_sdk.zip ]; then
            curl -sSL -o air_sdk.zip "https://github.com/Gamua/Adobe-AIR-SDK/releases/download/v50.2.3.1/AIRSDK_macOS.zip"
          fi

          # Распаковываем
          unzip -q air_sdk.zip -d air_sdk_folder
          
          # Проверяем исполняемые права
          chmod -R +x ./air_sdk_folder/bin/
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
