name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      # 1. Скачиваем SWF ассеты
      - name: Fetch SWF Assets from Releases
        run: |
          mkdir -p WebAssets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o WebAssets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o WebAssets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o WebAssets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o WebAssets/HenryCtM2.swf

      # 2. Динамический поиск файла и компиляция
      - name: Build Native App Bundle
        run: |
          rm -rf Payload
          mkdir -p Payload/HenryStickmin.app

          # Автоматически находим путь к AppDelegate.swift (или любому .swift файлу с исходником)
          SWIFT_PATH=$(find . -iname "*AppDelegate*.swift" -type f | head -n 1)

          if [ -z "$SWIFT_PATH" ]; then
            echo "Ищем любой .swift файл..."
            SWIFT_PATH=$(find . -iname "*.swift" -type f | head -n 1)
          fi

          echo "Используем файл: $SWIFT_PATH"

          if [ -z "$SWIFT_PATH" ]; then
            echo "ОШИБКА: Ни один .swift файл не найден!"
            exit 1
          fi

          # Компилируем найденный swift-файл
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/HenryStickmin.app/HenryStickmin \
            "$SWIFT_PATH"

          # Копируем веб-ассеты
          cp -R WebAssets Payload/HenryStickmin.app/

          # Создаём валидный iOS Info.plist
          cat << 'EOF' > Payload/HenryStickmin.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HenryStickmin</string>
              <key>CFBundleIdentifier</key>
              <string>com.henry.stickmin</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Henry Stickmin</string>
              <key>CFBundleDisplayName</key>
              <string>Henry Stickmin</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          EOF

      # 3. Правильная упаковка IPA (папка Payload внутри архива)
      - name: Package Valid IPA
        run: |
          codesign --force --sign - --timestamp=none Payload/HenryStickmin.app
          zip -r HenryStickmin-native.ipa Payload

      # 4. Выгрузка артефакта
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
