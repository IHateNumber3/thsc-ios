name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Крок 1: Розпакування AIR SDK
      - name: Setup AIR SDK
        run: |
          mkdir -p ~/sdks/air
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/AIRSDK_MacOS.zip" -o ~/Downloads/AIRSDK_MacOS.zip
          unzip -q ~/Downloads/AIRSDK_MacOS.zip -d ~/sdks/air
          
          xattr -r -d com.apple.quarantine ~/sdks/air || true
          chmod -R +x ~/sdks/air/bin
          
          echo "AIR_HOME=$HOME/sdks/air" >> $GITHUB_ENV
          echo "$HOME/sdks/air/bin" >> $GITHUB_PATH

      # Крок 2: Перевірка adt
      - name: Verify ADT
        run: |
          adt -version

      # Крок 3: Завантаження SWF асетів
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Крок 4: Генерація парного сертифіката та сумісного profile.mobileprovision
      - name: Generate Matched Cert and Provisioning Profile
        run: |
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout cert.key -out cert.crt \
            -subj "/CN=iPhone Developer: Dummy/OU=DEV/O=Dummy/C=US"

          openssl pkcs12 -export -out dummy.pfx -inkey cert.key -in cert.crt -passout pass:certpassword

          CERT_DER=$(openssl x509 -in cert.crt -outform DER | base64 | tr -d '\n')

          echo '<?xml version="1.0" encoding="UTF-8"?>' > profile.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> profile.plist
          echo '<plist version="1.0"><dict>' >> profile.plist
          echo '<key>AppIDName</key><string>HenryStickmin</string>' >> profile.plist
          echo '<key>ApplicationIdentifierPrefix</key><array><string>1234567890</string></array>' >> profile.plist
          echo '<key>CreationDate</key><date>2026-01-01T00:00:00Z</date>' >> profile.plist
          echo '<key>DeveloperCertificates</key><array><data>'"$CERT_DER"'</data></array>' >> profile.plist
          echo '<key>Entitlements</key><dict><key>application-identifier</key><string>1234567890.com.henry.stickmin</string><key>get-task-allow</key><true/></dict>' >> profile.plist
          echo '<key>ExpirationDate</key><date>2030-01-01T00:00:00Z</date>' >> profile.plist
          echo '<key>Name</key><string>Dummy Profile</string>' >> profile.plist
          echo '<key>ProvisionedDevices</key><array/>' >> profile.plist
          echo '<key>TeamIdentifier</key><array><string>1234567890</string></array>' >> profile.plist
          echo '<key>TimeToLive</key><integer>3650</integer>' >> profile.plist
          echo '<key>UUID</key><string>12345678-1234-1234-1234-123456789012</string>' >> profile.plist
          echo '<key>Version</key><integer>1</integer>' >> profile.plist
          echo '</dict></plist>' >> profile.plist

          openssl smime -sign -in profile.plist -out profile.mobileprovision -signer cert.crt -inkey cert.key -outform DER
          
          ls -lh profile.mobileprovision dummy.pfx

      # Крок 5: Упаковка 64-бітного iOS застосунку (iphoneos target)
      - name: Package iOS App
        run: |
          OS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK path: $OS_SDK_PATH"
          
          adt -package \
            -target ipa-test-interpreter \
            -storetype pkcs12 \
            -keystore dummy.pfx \
            -storepass certpassword \
            -provisioning-profile profile.mobileprovision \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            -platformsdk "$OS_SDK_PATH" \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt

      # Крок 6: Завантаження готового .ipa в артефакти
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
