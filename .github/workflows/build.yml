name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем airsdkmanager с GitHub через GitHub CLI
      - name: Setup Harman AIR SDK via airsdkmanager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Скачиваем ассеты из последнего релиза airsdkmanager-releases
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*macOS*.zip" --pattern "*macos*.zip" --pattern "*.pkg" || true
          
          # Распаковываем или находим скачанный файл
          mkdir -p manager
          if [ -f *.zip ]; then
            unzip -q *.zip -d manager
          elif [ -f *.pkg ]; then
            pkgutil --expand-full *.pkg manager/
          fi
          
          # Ищем исполняемый файл airsdkmanager и даем права
          EXE_PATH=$(find manager -name "airsdkmanager" -type f | head -n 1)
          chmod +x "$EXE_PATH"
          
          # Устанавливаем AIR SDK в папку air_sdk_folder
          "$EXE_PATH" --install 51.1.1.5 --path ./air_sdk_folder --license-agree
          
          chmod +x air_sdk_folder/bin/adt
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из вашего релиза
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
