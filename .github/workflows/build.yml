name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # Используем официальный проверенный экшен для установки AIR SDK
      - name: Setup Harman AIR SDK
        uses: airsdk/setup-airsdk@v1
        with:
          air-version: '50.1.1.2' # Стабильная версия, которая развернется сама

      # Качаем исходники игры встроенным модулем GitHub, который не режет ссылки
      - name: Download Henry Stickmin Assets
        uses: suisei-cn/actions-download-file@v1.4.0
        with:
          url: 'https://archive.org'
          target: './'
          filename: 'game_source.zip'

      - name: Unpack and Prepare
        run: |
          unzip -q game_source.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Create Unsigned IPA
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
