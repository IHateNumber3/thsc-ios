name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      # 1. Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          mkdir -p HenryApp/WebAssets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o HenryApp/WebAssets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryApp/WebAssets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryApp/WebAssets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryApp/WebAssets/HenryCtM2.swf

      # 2. Убеждаемся, что AppDelegate.swift на месте внутри HenryApp
      - name: Ensure HenryApp Source Exists
        run: |
          mkdir -p HenryApp
          if [ ! -f "HenryApp/AppDelegate.swift" ]; then
            cat << 'EOF' > HenryApp/AppDelegate.swift
          import UIKit
          import WebKit

          class AppSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
                  guard let url = urlSchemeTask.request.url else { return }
                  
                  var path = url.path
                  if path == "/" || path.isEmpty { path = "/index.html" }
                  
                  // Ищем внутри запеченной папки HenryApp в бандле
                  guard let bundlePath = Bundle.main.path(forResource: "HenryApp", ofType: nil) else { return }
                  let filePath = bundlePath + path
                  
                  if let data = try? Data(contentsOf: URL(fileURLWithPath: filePath)) {
                      let mimeType: String
                      if path.hasSuffix(".html") { mimeType = "text/html" }
                      else if path.hasSuffix(".js") { mimeType = "text/javascript" }
                      else if path.hasSuffix(".wasm") { mimeType = "application/wasm" }
                      else if path.hasSuffix(".swf") { mimeType = "application/x-shockwave-flash" }
                      else { mimeType = "application/octet-stream" }
                      
                      let response = URLResponse(url: url, mimeType: mimeType, expectedContentLength: data.count, textEncodingName: "utf-8")
                      urlSchemeTask.didReceive(response)
                      urlSchemeTask.didReceive(data)
                      urlSchemeTask.didFinish()
                  }
              }
              
              func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  
                  let config = WKWebViewConfiguration()
                  let handler = AppSchemeHandler()
                  config.setURLSchemeHandler(handler, forURLScheme: "app")
                  
                  let webView = WKWebView(frame: vc.view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.isScrollEnabled = false
                  vc.view.addSubview(webView)
                  
                  if let url = URL(string: "app://henry/WebAssets/index.html") {
                      webView.load(URLRequest(url: url))
                  }
                  
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF
          fi

      # 3. Генерируем проект: компилируем AppDelegate.swift, а всю папку HenryApp пакуем целиком как ресурс
      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: HenryStickmin
          options:
            bundleIdPrefix: com.henry
            deploymentTarget:
              iOS: "15.0"
          targets:
            HenryStickmin:
              type: application
              platform: iOS
              sources:
                - path: HenryApp/AppDelegate.swift
              resources:
                - path: HenryApp
                  excludes:
                    - "AppDelegate.swift"
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.henry.stickmin
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_CFBundleDisplayName: "Henry Stickmin"
                INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                INFOPLIST_KEY_UIRequiresFullScreen: YES
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
          EOF
          xcodegen generate

      # 4. Сборка через xcodebuild
      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -project HenryStickmin.xcodeproj \
            -scheme HenryStickmin \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 5. Упаковка в IPA (папка HenryApp со всеми файлами лежит прямо внутри Payload/HenryStickmin.app/)
      - name: Package Native IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HenryStickmin.app Payload/
          
          # На всякий случай проверяем, чтобы папка HenryApp со всеми файлами точно скопировалась внутрь .app
          if [ -d "HenryApp" ]; then
            rsync -av --exclude="AppDelegate.swift" HenryApp/ Payload/HenryStickmin.app/HenryApp/
          fi
          
          zip -r HenryStickmin-native.ipa Payload

      # 6. Выгрузка артефакта
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
