name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем и устанавливаем официальный .pkg пакетом в систему macOS
      - name: Install Harman AIR SDK via PKG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Скачиваем .pkg файл из релизов airsdkmanager
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*.pkg" --clobber
          
          PKG_FILE=$(ls *.pkg | head -n 1)
          echo "Found package: $PKG_FILE"
          
          # 2. Устанавливаем тихим образом в систему
          sudo installer -pkg "$PKG_FILE" -target /
          
          # 3. Ищем, куда установился бинарник adt
          ADT_BIN=$(find /Library /usr/local /Applications -name "adt" -type f 2>/dev/null | head -n 1)
          
          if [ -n "$ADT_BIN" ]; then
            echo "ADT found at: $ADT_BIN"
            echo "$(dirname "$ADT_BIN")" >> $GITHUB_PATH
          else
            echo "ADT not found after pkg install"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
