name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем готовый adt.jar из Maven и подготавливаем дескриптор
      - name: Setup Standalone ADT Compiler
        run: |
          mkdir -p air_sdk_folder/lib
          
          # Скачиваем рабочий adt.jar напрямую из реестра Maven
          curl -sSL "https://repo1.maven.org/maven2/com/adobe/air/compiler/adt/32.0.0.116/adt-32.0.0.116.jar" -o air_sdk_folder/lib/adt.jar
          
          # Создаем минимальный air-sdk-description.xml, чтобы adt не ругался на отсутствие SDK
          cat << 'EOF' > air_sdk_folder/air-sdk-description.xml
          <?xml version="1.0" encoding="utf-8"?>
          <sdk>
              <name>AIR SDK</name>
              <version>32.0.0.116</version>
              <build>116</build>
          </sdk>
          EOF
          
          echo "ADT_JAR_PATH=$GITHUB_WORKSPACE/air_sdk_folder/lib/adt.jar" >> $GITHUB_ENV

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения напрямую через java -jar
      - name: Package iOS App
        run: |
          java -jar "$ADT_JAR_PATH" -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
