name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 1: Скачиваем и распаковываем Linux ZIP airsdkmanager
      - name: Setup AIR SDK via Linux Manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Скачиваем zip для linux_amd64 из релизов
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*linux_amd64*.zip" --clobber
          
          # 2. Распаковываем
          mkdir -p manager
          unzip -q *.zip -d manager
          
          # 3. Даем права на исполнение
          chmod +x manager/airsdkmanager
          
          # 4. Скачиваем сам AIR SDK в папку air_sdk_folder
          mkdir -p air_sdk_folder
          ./manager/airsdkmanager --install 51.1.1.5 --path "$GITHUB_WORKSPACE/air_sdk_folder" --license-agree
          
          # 5. Проверяем права на adt и добавляем в PATH
          chmod -R +x ./air_sdk_folder/bin/
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Step 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Step 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
