name: Build Henry IPA (AIR)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download SWFs and AIR SDK from release "Files"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download Files --repo "${{ github.repository }}" --dir dl \
            -p 'AIRSDK_MacOS.zip' -p '*.swf'
          ls -lh dl

      - name: Unpack AIR SDK
        run: |
          mkdir -p "$HOME/airsdk"
          unzip -q dl/AIRSDK_MacOS.zip -d "$HOME/airsdk"
          ADT=$(find "$HOME/airsdk" -name adt.jar -path '*/lib/*' | head -1)
          SDK=$(dirname "$(dirname "$ADT")")
          chmod -R +x "$SDK/bin" || true
          AIRVER=$(grep -m1 -o '<version>[0-9]*\.[0-9]*' "$SDK/air-sdk-description.xml" | sed 's/<version>//')
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "AIRVER=$AIRVER" >> "$GITHUB_ENV"
          echo "SDK=$SDK AIRVER=$AIRVER"

      - name: Build stub ANE (replaces Windows-only FRESteamWorks)
        run: |
          mkdir -p build/ext stub/src/com/amanitadesign/steam
          cat > stub/src/com/amanitadesign/steam/FRESteamWorks.as <<'AS'
          package com.amanitadesign.steam
          {
          	import flash.events.EventDispatcher;
          	import flash.events.IEventDispatcher;
          	public class FRESteamWorks extends EventDispatcher
          	{
          		public function FRESteamWorks(target:IEventDispatcher = null) { super(target); }
          		public function init():Boolean { return true; }
          		public function isReady():Boolean { return true; }
          		public function runCallbacks():Boolean { return true; }
          		public function requestStats():Boolean { return true; }
          		public function storeStats():Boolean { return true; }
          		public function setAchievement(name:String):Boolean { return true; }
          		public function isAchievement(name:String):Boolean { return false; }
          		public function clearAchievement(name:String):Boolean { return true; }
          		public function dispose():void {}
          	}
          }
          AS
          cat > build/extension.xml <<EXT
          <extension xmlns="http://ns.adobe.com/air/extension/$AIRVER">
          	<id>com.amanitadesign.steam.FRESteamWorks</id>
          	<versionNumber>0.7.0</versionNumber>
          	<platforms>
          		<platform name="default">
          			<applicationDeployment/>
          		</platform>
          	</platforms>
          </extension>
          EXT
          "$SDK/bin/compc" +configname=air \
            -source-path stub/src \
            -include-classes com.amanitadesign.steam.FRESteamWorks \
            -swf-version=32 \
            -output build/stub.swc
          mkdir -p build/swc && unzip -o build/stub.swc library.swf -d build/swc
          java -jar "$SDK/lib/adt.jar" -package -target ane \
            build/ext/com.amanitadesign.steam.FRESteamWorks.ane \
            build/extension.xml -swc build/stub.swc \
            -platform default -C build/swc library.swf

      - name: Assemble package folder
        run: |
          mkdir -p build/pkg
          cp dl/*.swf build/pkg/
          cp -R icons build/pkg/icons
          cp ./*_english.txt build/pkg/
          sed -E "s#air/application/[0-9.]+#air/application/$AIRVER#" HenryStickmin-app.xml > build/pkg/application.xml
          ls -lh build/pkg

      - name: Dummy signing identity + fake profile (KSign re-signs later)
        run: |
          mkdir -p build/sign
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OSSL" ] || OSSL=openssl
          "$OSSL" version
          # Apple-style development cert: CN "iPhone Developer: ...", codeSigning EKU,
          # Apple iOS-development OID extension
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout build/sign/key.pem -out build/sign/cert.pem \
            -subj "/CN=iPhone Developer: Dummy Dev (DUMMY00000)/OU=DUMMY00000/O=Dummy Dev/C=US" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -addext "1.2.840.113635.100.6.1.2=critical,DER:0500"
          "$OSSL" pkcs12 -export -inkey build/sign/key.pem -in build/sign/cert.pem \
            -name dummy -passout pass:pass \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -out build/sign/dummy.p12
          "$OSSL" x509 -in build/sign/cert.pem -outform der -out build/sign/cert.der
          python3 - <<'PY'
          import plistlib, uuid, datetime
          cert = open("build/sign/cert.der", "rb").read()
          now = datetime.datetime.utcnow()
          plistlib.dump({
              "Name": "Dummy", "UUID": str(uuid.uuid4()),
              "AppIDName": "Dummy", "TeamName": "Dummy",
              "ApplicationIdentifierPrefix": ["DUMMY00000"],
              "TeamIdentifier": ["DUMMY00000"],
              "Platform": ["iOS"],
              "CreationDate": now,
              "ExpirationDate": now + datetime.timedelta(days=3650),
              "DeveloperCertificates": [cert],
              "Entitlements": {
                  "application-identifier": "DUMMY00000.*",
                  "get-task-allow": True,
                  "com.apple.developer.team-identifier": "DUMMY00000",
              },
              "ProvisionsAllDevices": True,
          }, open("build/sign/profile.plist", "wb"))
          PY
          "$OSSL" smime -sign -nodetach -binary -outform der \
            -in build/sign/profile.plist -signer build/sign/cert.pem \
            -inkey build/sign/key.pem -out build/sign/dummy.mobileprovision
          echo "--- adt -checkstore ---"
          java -jar "$SDK/lib/adt.jar" -checkstore -storetype pkcs12 \
            -keystore build/sign/dummy.p12 -storepass pass || true

      - name: "Package IPA (interpreter, game loads sub-SWFs at runtime)"
        working-directory: build/pkg
        run: |
          # the SDK zip may have lost exec bits on the iOS toolchain
          find "$SDK/lib" "$SDK/bin" -type f \( -path '*/aot/*' -o -path '*/bin/*' \) -exec chmod +x {} + || true
          xcodebuild -version
          java -Xmx4g -jar "$SDK/lib/adt.jar" -package \
            -target ipa-test-interpreter \
            -storetype pkcs12 -keystore ../sign/dummy.p12 -storepass pass \
            -provisioning-profile ../sign/dummy.mobileprovision \
            ../../HenryStickmin.ipa application.xml \
            -platformsdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf \
            icons *_english.txt \
            -extdir ../ext

      - uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-ipa
          path: HenryStickmin.ipa
