name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем airsdkmanager с официального GitHub Harman AIR
      - name: Setup Harman AIR SDK via airsdkmanager
        run: |
          # Скачиваем CLI утилиту airsdkmanager под macOS (arm64/x64)
          curl -sSL "https://github.com/airsdk/airsdkmanager-releases/releases/download/v1.1.3/airsdkmanager-macos-arm64.zip" -o airsdkmanager.zip || \
          curl -sSL "https://github.com/airsdk/airsdkmanager-releases/releases/download/v1.1.3/airsdkmanager-macos-x64.zip" -o airsdkmanager.zip
          
          unzip -q airsdkmanager.zip -d manager
          chmod +x manager/airsdkmanager
          
          # Устанавливаем AIR SDK в папку air_sdk_folder
          ./manager/airsdkmanager --install 51.1.1.5 --path ./air_sdk_folder --license-agree
          
          chmod +x air_sdk_folder/bin/adt
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из вашего релиза
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
