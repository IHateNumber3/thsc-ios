name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      # 1. Скачиваем SWF файлы из релизов прямо в папку WebAssets
      - name: Fetch SWF Assets from Releases
        run: |
          mkdir -p WebAssets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o WebAssets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o WebAssets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o WebAssets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o WebAssets/HenryCtM2.swf

      # 2. Компилируем AppDelegate.swift с абсолютным путем
      - name: Build Unsigned App with swiftc
        run: |
          mkdir -p Payload/HenryStickmin.app

          # Компилируем arm64 бинарник, используя точный путь к файлу в репозитории
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/HenryStickmin.app/HenryStickmin \
            "${{ github.workspace }}/HenryApp/AppDelegate.swift"

          # Копируем веб-ассеты (index.html, ruffle.js, *.wasm, *.swf) внутрь .app
          cp -R WebAssets Payload/HenryStickmin.app/
          
          # Info.plist
          cat << 'EOF' > Payload/HenryStickmin.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HenryStickmin</string>
              <key>CFBundleIdentifier</key>
              <string>com.henry.stickmin</string>
              <key>CFBundleName</key>
              <string>Henry Stickmin</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiresFullScreen</key>
              <true/>
          </dict>
          EOF

      # 3. Подпись Ad-Hoc и упаковка IPA
      - name: Package IPA
        run: |
          codesign --force --sign - --timestamp=none Payload/HenryStickmin.app
          ditto -ck --sequesterRsrc --keepParent Payload HenryStickmin-native-unsigned.ipa

      # 4. Выгрузка готового IPA в артефакты
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-unsigned-ipa
          path: HenryStickmin-native-unsigned.ipa
