name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Установка AIRSDKManager из .pkg и скачивание AIR SDK
      - name: Setup Harman AIR SDK via airsdkmanager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Скачиваем .pkg пакет
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*.pkg" --clobber
          
          # 2. Устанавливаем в систему
          sudo installer -pkg AIRSDKManager_*.pkg -target /
          
          # 3. Путь к бинарнику airsdkmanager внутри macOS приложения
          AIRSDK_MGR="/Applications/AIRSDKManager.app/Contents/MacOS/airsdkmanager"
          
          # 4. Скачиваем AIR SDK в рабочую папку
          mkdir -p "$GITHUB_WORKSPACE/air_sdk_folder"
          echo "y" | "$AIRSDK_MGR" --install 51.1.1.5 --path "$GITHUB_WORKSPACE/air_sdk_folder" --license-agree
          
          # 5. Проверяем наличие bin/adt и добавляем в PATH
          chmod -R +x "$GITHUB_WORKSPACE/air_sdk_folder/bin/"
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
