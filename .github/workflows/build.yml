name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Распаковка AIR SDK
      - name: Setup AIR SDK
        run: |
          mkdir -p ~/sdks/air
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/AIRSDK_MacOS.zip" -o ~/Downloads/AIRSDK_MacOS.zip
          unzip -q ~/Downloads/AIRSDK_MacOS.zip -d ~/sdks/air
          
          xattr -r -d com.apple.quarantine ~/sdks/air || true
          chmod -R +x ~/sdks/air/bin
          
          echo "AIR_HOME=$HOME/sdks/air" >> $GITHUB_ENV
          echo "$HOME/sdks/air/bin" >> $GITHUB_PATH

      # Шаг 2: Проверка ADT
      - name: Verify ADT
        run: |
          adt -version

      # Шаг 3: Скачивание SWF ассетов
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf

      # Шаг 4: Генерация dummy PFX для формального удовлетворения ADT
      - name: Create Dummy PFX
        run: |
          adt -certificate -cn DummyCert 2048-RSA dummy.pfx certpassword

      # Шаг 5: Сборка симуляторного пакета (без профиля мобилпровайдинга!)
      - name: Package Base IPA
        run: |
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          
          adt -package \
            -target ipa-test-interpreter-simulator \
            -storetype pkcs12 \
            -keystore dummy.pfx \
            -storepass certpassword \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            -platformsdk "$SIM_SDK_PATH" \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt

      # Шаг 6: Замена бинарника на ARM64 и сборка готового IPA
      - name: Patch to 64-bit ARM64 Architecture
        run: |
          unzip -q HenryStickmin.ipa -d ipa_extract
          
          # Ищем 64-битный исполняемый файл интерпретатора в AIR SDK
          AIR_RUNNER=$(find "$AIR_HOME" -name "CTAIRInterpreter" | head -n 1)
          echo "Found AIR runner: $AIR_RUNNER"
          
          APP_DIR=$(ls -d ipa_extract/Payload/*.app)
          APP_NAME=$(basename "$APP_DIR" .app)
          
          # Заменяем симуляторный бинарник на настоящую 64-битную ARM64 структуру под iPhone
          cp -f "$AIR_RUNNER" "$APP_DIR/$APP_NAME"
          chmod +x "$APP_DIR/$APP_NAME"
          
          # Запаковываем финальный IPA
          cd ipa_extract
          zip -q -r ../HenryStickmin-ARM64.ipa Payload
          cd ..
          
          ls -lh HenryStickmin-ARM64.ipa

      # Шаг 7: Выгрузка готового .ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-ARM64-ipa
          path: HenryStickmin-ARM64.ipa
          if-no-files-found: error
