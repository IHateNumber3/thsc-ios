name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Достаем AIR SDK из .pkg напрямую через pkgutil без GUI и висяков
      - name: Extract AIR SDK from PKG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*.pkg" --clobber
          PKG_FILE=$(ls *.pkg | head -n 1)
          echo "Extracting package: $PKG_FILE"
          
          # Распаковываем содержимое pkg в папку pkg_extracted
          pkgutil --expand-full "$PKG_FILE" pkg_extracted
          
          # Ищем утилиту adt
          ADT_BIN=$(find pkg_extracted -name "adt" -type f | head -n 1)
          
          if [ -n "$ADT_BIN" ]; then
            ADT_DIR=$(dirname "$ADT_BIN")
            chmod -R +x "$ADT_DIR"
            echo "$ADT_DIR" >> $GITHUB_PATH
            echo "ADT ready at: $ADT_BIN"
          else
            echo "ADT not found in pkg payload"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
