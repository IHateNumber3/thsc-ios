name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup AIR SDK
        run: |
          mkdir -p ~/sdks/air
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/AIRSDK_MacOS.zip" -o ~/Downloads/AIRSDK_MacOS.zip
          unzip -q ~/Downloads/AIRSDK_MacOS.zip -d ~/sdks/air
          xattr -r -d com.apple.quarantine ~/sdks/air || true
          chmod -R +x ~/sdks/air/bin
          echo "AIR_HOME=$HOME/sdks/air" >> $GITHUB_ENV
          echo "$HOME/sdks/air/bin" >> $GITHUB_PATH

      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf

      # Сборка структуры бандла
      - name: Build Base App Bundle
        run: |
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          adt -certificate -cn DummyCert 2048-RSA dummy.pfx certpassword

          adt -package \
            -target ipa-test-interpreter-simulator \
            -storetype pkcs12 \
            -keystore dummy.pfx \
            -storepass certpassword \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            -platformsdk "$SIM_SDK_PATH" \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt

      # Патч бинарника под arm64 и Ad-Hoc подпись через codesign/ditto
      - name: Patch ARM64 Architecture and Ad-Hoc Sign
        run: |
          unzip -q HenryStickmin.ipa -d temp_extract
          rm -rf Payload HenryStickmin.ipa
          mkdir -p Payload
          mv temp_extract/Payload/HenryStickmin.app Payload/
          rm -rf temp_extract

          APP_DIR="Payload/HenryStickmin.app"

          # Ищем бинарник с arm64 архитектурой внутри AIR SDK
          ARM64_BINARY=""
          for b in $(find "$AIR_HOME" -name "CTAIRInterpreter" -o -name "Adobe AIR"); do
            if file "$b" | grep -q "arm64"; then
              ARM64_BINARY="$b"
              break
            fi
          done

          if [ -n "$ARM64_BINARY" ]; then
            echo "Found valid ARM64 runner: $ARM64_BINARY"
            cp -f "$ARM64_BINARY" "$APP_DIR/HenryStickmin"
          fi

          chmod +x "$APP_DIR/HenryStickmin"

          # Подпись и архивация ровно по аналогии с маком в Catty/SourceEngine
          codesign --force --sign - --timestamp=none "$APP_DIR" || true
          ditto -ck --sequesterRsrc --keepParent Payload HenryStickmin-scenes-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-scenes-unsigned-ipa
          path: HenryStickmin-scenes-unsigned.ipa
