name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем APM напрямую с GitHub Releases и устанавливаем AIR SDK
      - name: Setup Harman AIR SDK via Direct APM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Выкачиваем последний релиз apm CLI через gh
          gh release download --repo airsdk/apm --pattern "*macos*.zip" --clobber || \
          gh release download --repo airsdk/apm --pattern "*.zip" --clobber
          
          mkdir -p apm_bin
          unzip -q *.zip -d apm_bin
          
          # Находим исполняемый файл apm
          APM_EXEC=$(find apm_bin -name "apm" -type f | head -n 1)
          chmod +x "$APM_EXEC"
          
          # 2. Инициализируем и выкачиваем SDK
          "$APM_EXEC" project init --force || true
          "$APM_EXEC" sdk install 51.1.1.5
          
          # 3. Добавляем путь к SDK в PATH
          AIR_SDK_DIR=$("$APM_EXEC" sdk path)
          chmod -R +x "$AIR_SDK_DIR/bin/"
          echo "$AIR_SDK_DIR/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
