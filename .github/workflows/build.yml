name: Build Henry Stickmin iOS App

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      # 1. Скачиваем SWF
      - name: Fetch SWF Assets
        run: |
          mkdir -p WebAssets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o WebAssets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o WebAssets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o WebAssets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o WebAssets/HenryCtM2.swf

      # 2. Генерируем код Swift
      - name: Ensure HenryApp Source Exists
        run: |
          mkdir -p HenryApp
          cat << 'EOF' > HenryApp/AppDelegate.swift
          import UIKit
          import WebKit

          class AppSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
                  guard let url = urlSchemeTask.request.url else { return }
                  
                  var path = url.path
                  if path == "/" || path.isEmpty { path = "/index.html" }
                  
                  guard let bundlePath = Bundle.main.path(forResource: "WebAssets", ofType: nil) else { return }
                  let filePath = bundlePath + path
                  
                  if let data = try? Data(contentsOf: URL(fileURLWithPath: filePath)) {
                      let mimeType: String
                      if path.hasSuffix(".html") { mimeType = "text/html" }
                      else if path.hasSuffix(".js") { mimeType = "text/javascript" }
                      else if path.hasSuffix(".wasm") { mimeType = "application/wasm" }
                      else if path.hasSuffix(".swf") { mimeType = "application/x-shockwave-flash" }
                      else { mimeType = "application/octet-stream" }
                      
                      let response = URLResponse(url: url, mimeType: mimeType, expectedContentLength: data.count, textEncodingName: "utf-8")
                      urlSchemeTask.didReceive(response)
                      urlSchemeTask.didReceive(data)
                      urlSchemeTask.didFinish()
                  }
              }
              
              func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  
                  let config = WKWebViewConfiguration()
                  let handler = AppSchemeHandler()
                  config.setURLSchemeHandler(handler, forURLScheme: "app")
                  
                  let webView = WKWebView(frame: vc.view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.isScrollEnabled = false
                  vc.view.addSubview(webView)
                  
                  if let url = URL(string: "app://henry/index.html") {
                      webView.load(URLRequest(url: url))
                  }
                  
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      # 3. Компиляция и сборка структуры Payload
      - name: Build Executable and Assets
        run: |
          rm -rf Payload
          mkdir -p Payload/HenryStickmin.app

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # Компилируем бинарник
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -O \
            -o Payload/HenryStickmin.app/HenryStickmin \
            HenryApp/AppDelegate.swift

          # Копируем веб-ресурсы
          cp -R WebAssets Payload/HenryStickmin.app/

          # Полный валидный Info.plist с указанием главного запуска
          cat << 'EOF' > Payload/HenryStickmin.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HenryStickmin</string>
              <key>CFBundleIdentifier</key>
              <string>com.henry.stickmin</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Henry Stickmin</string>
              <key>CFBundleDisplayName</key>
              <string>Henry Stickmin</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          EOF

      # 4. Упаковка IPA с Ad-Hoc подписью
      - name: Package IPA
        run: |
          codesign --force --sign - --timestamp=none Payload/HenryStickmin.app
          zip -r HenryStickmin-native.ipa Payload

      # 5. Выгрузка
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
