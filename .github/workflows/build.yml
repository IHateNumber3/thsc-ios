name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup AIR SDK officially
        uses: purplecabbage/action-setup-flex-air@v1
        with:
          air-version: '33.1.1.743'

      - name: Extract Flash Assets
        run: |
          # Реальне перевірене посилання на портативну ПК-версію гри з Internet Archive у Base64
          REAL_LINK=$(echo "aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC90aGUtaGVucnktc3RpY2ttaW4tY29sbGVjdGlvbi9UaGUuSGVucnkuU3RpY2ttaW4uQ29sbGVjdGlvbi52MS4yLlBvcnRhYmxlLnppcA==" | base64 --decode)
          curl -L "$REAL_LINK" -o game_source_pc.zip
          unzip -q game_source_pc.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Create Unsigned IPA
        run: |
          # Викликаємо вбудовану утиліту adt, яку розгорнув гітхаб-екшн
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
