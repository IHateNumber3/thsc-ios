name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем оригинальный AIR SDK напрямую из Maven
      - name: Download AIR SDK Archive
        run: |
          mkdir -p air_sdk_folder
          
          # Скачиваем официальный zip-архив AIR SDK из репозитория Apache / Maven Central
          curl -sSL "https://repo1.maven.org/maven2/com/adobe/air/compiler/air-compiler-sdk/32.0.0.116/air-compiler-sdk-32.0.0.116.zip" -o air_sdk.zip || \
          curl -sSL "https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip" -o air_sdk.zip
          
          unzip -q air_sdk.zip -d air_sdk_folder
          
          # Находим adt и добавляем в PATH
          ADT_BIN=$(find "$GITHUB_WORKSPACE/air_sdk_folder" -name "adt" -type f | head -n 1)
          
          if [ -n "$ADT_BIN" ]; then
            ADT_DIR=$(dirname "$ADT_BIN")
            chmod -R +x "$ADT_DIR"
            echo "$ADT_DIR" >> $GITHUB_PATH
            echo "ADT ready at: $ADT_BIN"
          else
            echo "Failed to find adt in extracted zip"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
