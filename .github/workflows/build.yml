name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Устанавливаем AIRSDKManager .pkg и скачиваем SDK через CLI
      - name: Setup Harman AIR SDK via AIRSDKManager CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Скачиваем .pkg из официального репозитория
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*.pkg" --clobber
          
          # 2. Устанавливаем .pkg в систему
          sudo installer -pkg AIRSDKManager_*.pkg -target /
          
          # 3. Ищем бинарник CLI утилиты airsdkmanager
          MGR_PATH=$(which airsdkmanager || echo "/Applications/AIRSDKManager.app/Contents/Resources/bin/airsdkmanager")
          if [ ! -f "$MGR_PATH" ]; then
            MGR_PATH=$(find /Applications/AIRSDKManager.app -name "airsdkmanager" -type f | head -n 1)
          fi
          
          echo "Found airsdkmanager at: $MGR_PATH"
          
          # 4. Скачиваем AIR SDK в папку air_sdk_folder
          mkdir -p "$GITHUB_WORKSPACE/air_sdk_folder"
          "$MGR_PATH" --install --version 51.1.1.5 --path "$GITHUB_WORKSPACE/air_sdk_folder" --license-agree || \
          "$MGR_PATH" --install 51.1.1.5 --path "$GITHUB_WORKSPACE/air_sdk_folder" --license-agree
          
          # 5. Выставляем права на исполнение и добавляем в PATH
          chmod -R +x "$GITHUB_WORKSPACE/air_sdk_folder/bin/"
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты из вашего релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
