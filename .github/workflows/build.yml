name: Build Mall IPA (VECTOR)

on:
  workflow_dispatch:
    inputs:
      res_tag:
        description: "Release tag with resources.zip"
        default: "Defending"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AIR SDK and resources.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download Files --repo "${{ github.repository }}" --dir dl \
            -p 'AIRSDK_MacOS.zip' || true
          if [ ! -f dl/AIRSDK_MacOS.zip ]; then
            gh release download Files --repo IHateNumber3/thsc-ios --dir dl \
              -p 'AIRSDK_MacOS.zip' || true
          fi
          if [ ! -f dl/AIRSDK_MacOS.zip ]; then
            curl -sSL "https://airsdk.harman.com/assets/downloads/33.1.1.930/AIRSDK_MacOS.zip" -o dl/AIRSDK_MacOS.zip
          fi
          gh release download "${{ github.event.inputs.res_tag }}" --repo "${{ github.repository }}" --dir dl \
            -p 'resources.zip'
          ls -lh dl

      - name: Unpack AIR SDK
        run: |
          mkdir -p "$HOME/airsdk"
          unzip -q dl/AIRSDK_MacOS.zip -d "$HOME/airsdk"
          ADT=$(find "$HOME/airsdk" -name adt.jar -path '*/lib/*' | head -1)
          SDK=$(dirname "$(dirname "$ADT")")
          chmod -R +x "$SDK/bin" || true
          AIRVER=$(grep -m1 -o '<version>[0-9]*\.[0-9]*' "$SDK/air-sdk-description.xml" | sed 's/<version>//')
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "AIRVER=$AIRVER" >> "$GITHUB_ENV"
          echo "SDK=$SDK AIRVER=$AIRVER"

      - name: Assemble package folder from resources.zip
        run: |
          mkdir -p build/pkg tmp_res
          unzip -q dl/resources.zip -d tmp_res/
          SWF_PATH=$(find tmp_res -name "game.swf" | head -1)
          if [ -z "$SWF_PATH" ]; then
            echo "ERROR: game.swf not found in resources.zip"
            exit 1
          fi
          SRC_DIR=$(dirname "$SWF_PATH")
          echo "resources root: $SRC_DIR"
          mv "$SRC_DIR/game.swf" build/pkg/bundle.swf
          # the AS3 runtime loads app:/assets/game.json, app:/assets/gfx/*, app:/assets/snd/*
          mkdir -p build/pkg/assets
          if [ -d "$SRC_DIR/assets" ]; then
            cp -R "$SRC_DIR/assets/." build/pkg/assets/
          else
            for x in game.json gfx snd; do
              [ -e "$SRC_DIR/$x" ] && cp -R "$SRC_DIR/$x" build/pkg/assets/
            done
          fi
          ls -la build/pkg build/pkg/assets | head -30

      - name: Sanity check assets (fail early on wrong game.json)
        run: |
          python3 - <<'PY'
          import json, os, sys
          base = "build/pkg/assets"
          g = json.load(open(base + "/game.json", encoding="utf-8"))
          missing_key = 0
          missing_file = 0
          total = 0
          for t in g["targets"]:
              for c in t["costumes"]:
                  total += 1
                  f = c.get("file")
                  if f is None:
                      missing_key += 1
                  elif not os.path.exists(base + "/gfx/" + f):
                      missing_file += 1
          print("game.json bytes", os.path.getsize(base + "/game.json"))
          print("costumes", total, "without 'file'", missing_key, "png missing", missing_file)
          if missing_key or missing_file > total * 0.01:
              print("ERROR: this game.json/gfx is not the output of flash/tools/convert.py.")
              print("Costumes need a 'file' key and a rasterized PNG in gfx/. Re-run convert.py and rebuild resources.zip.")
              sys.exit(1)
          PY

      - name: Write app descriptor
        run: |
          cat > build/pkg/application.xml <<APPXML
          <?xml version="1.0" encoding="utf-8"?>
          <application xmlns="http://ns.adobe.com/air/application/$AIRVER">
            <id>com.mall.flash</id>
            <versionNumber>0.1</versionNumber>
            <filename>DefendingTheMall</filename>
            <name>DTM</name>
            <initialWindow>
              <content>bundle.swf</content>
              <fullScreen>true</fullScreen>
              <aspectRatio>landscape</aspectRatio>
              <autoOrients>true</autoOrients>
              <renderMode>gpu</renderMode>
            </initialWindow>
            <supportedProfiles>mobileDevice</supportedProfiles>
            <iPhone>
              <requestedDisplayResolution>medium</requestedDisplayResolution>
            </iPhone>
          </application>
          APPXML
          cat build/pkg/application.xml

      - name: Dummy signing identity + fake profile (KSign re-signs later)
        run: |
          mkdir -p build/sign
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OSSL" ] || OSSL=openssl
          "$OSSL" version
          # Apple-style development cert: CN "iPhone Developer: ...", codeSigning EKU,
          # Apple iOS-development OID extension
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout build/sign/key.pem -out build/sign/cert.pem \
            -subj "/CN=iPhone Developer: Dummy Dev (DUMMY00000)/OU=DUMMY00000/O=Dummy Dev/C=US" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -addext "1.2.840.113635.100.6.1.2=critical,DER:0500"
          "$OSSL" pkcs12 -export -inkey build/sign/key.pem -in build/sign/cert.pem \
            -name dummy -passout pass:pass \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -out build/sign/dummy.p12
          "$OSSL" x509 -in build/sign/cert.pem -outform der -out build/sign/cert.der
          python3 - <<'PY'
          import plistlib, uuid, datetime
          cert = open("build/sign/cert.der", "rb").read()
          now = datetime.datetime.utcnow()
          plistlib.dump({
              "Name": "Dummy", "UUID": str(uuid.uuid4()),
              "AppIDName": "Dummy", "TeamName": "Dummy",
              "ApplicationIdentifierPrefix": ["DUMMY00000"],
              "TeamIdentifier": ["DUMMY00000"],
              "Platform": ["iOS"],
              "CreationDate": now,
              "ExpirationDate": now + datetime.timedelta(days=3650),
              "DeveloperCertificates": [cert],
              "Entitlements": {
                  "application-identifier": "DUMMY00000.*",
                  "get-task-allow": True,
                  "com.apple.developer.team-identifier": "DUMMY00000",
              },
              "ProvisionsAllDevices": True,
          }, open("build/sign/profile.plist", "wb"))
          PY
          "$OSSL" smime -sign -nodetach -binary -outform der \
            -in build/sign/profile.plist -signer build/sign/cert.pem \
            -inkey build/sign/key.pem -out build/sign/dummy.mobileprovision
          echo "--- adt -checkstore ---"
          java -jar "$SDK/lib/adt.jar" -checkstore -storetype pkcs12 \
            -keystore build/sign/dummy.p12 -storepass pass || true

      - name: "Package IPA"
        working-directory: build/pkg
        run: |
          find "$SDK/lib" "$SDK/bin" -type f \( -path '*/aot/*' -o -path '*/bin/*' \) -exec chmod +x {} + || true
          java -Xmx4g -jar "$SDK/lib/adt.jar" -package \
            -target ipa-test-interpreter \
            -storetype pkcs12 -keystore ../sign/dummy.p12 -storepass pass \
            -provisioning-profile ../sign/dummy.mobileprovision \
            ../../DefendingTheMall.ipa application.xml \
            -platformsdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            bundle.swf assets
          ls -lh ../../DefendingTheMall.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DefendingTheMall-ipa
          path: DefendingTheMall.ipa
