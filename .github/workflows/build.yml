name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем официальный Linux AIR SDK напрямую
      - name: Download Harman AIR SDK for Linux
        run: |
          mkdir -p air_sdk_folder
          
          # Скачиваем официально поддерживаемый zip-архив AIR SDK для Linux
          curl -sSL -A "Mozilla/5.0" "https://airsdk.harman.com/api/v1/downloads/sdk/51.1.1.5/linux" -o air_sdk.zip || \
          curl -sSL -A "Mozilla/5.0" "https://airsdk.harman.com/download/51.1.1.5/AIRSDK_Linux.zip" -o air_sdk.zip
          
          unzip -q air_sdk.zip -d air_sdk_folder
          
          # Даем права на исполнение бинарникам (adt, adl и т.д.)
          chmod -R +x ./air_sdk_folder/bin/
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
