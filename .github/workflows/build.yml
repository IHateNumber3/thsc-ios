name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Harman SDK via Manager
        run: |
          # Розбиваємо лінк на шматки, щоб мобільний Safari не зміг його врізати
          PART1="https://github.com"
          PART2="/releases/download/v1.1.2/airsdkmanager-linux-x64.zip"
          curl -L "${PART1}${PART2}" -o manager.zip
          
          unzip -q manager.zip -d manager_folder
          chmod +x manager_folder/airsdkmanager
          ./manager_folder/airsdkmanager --install --path=$GITHUB_WORKSPACE/air_sdk_folder
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      - name: Extract Flash Assets
        run: |
          # Склеюємо лінк на гру з веб-архіву
          G1="https://archive.org"
          G2="/The.Henry.Stickmin.Collection.v1.2.Portable.zip"
          curl -L "${G1}${G2}" -o game_source_pc.zip
          
          unzip -q game_source_pc.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Create Unsigned IPA
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
