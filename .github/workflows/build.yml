name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Harman SDK via Manager
        run: |
          # Склеиваем точную перевірену адресу для Linux x64
          B="https://github.com"
          P="/airsdk/airsdkmanager-releases/releases/download/v1.1.2/AIRSDKManager_linux_amd64_1.1.2.zip"
          curl -L "${B}${P}" -o manager.zip
          
          unzip -q manager.zip -d manager_folder
          
          # Находим точный путь к бинарнику, игнорируя регистр букв и подпапки
          EXE_PATH=$(find manager_folder -type f -iname "*airsdkmanager*" | head -n 1)
          chmod +x "$EXE_PATH"
          
          # Запускаем его для установки SDK
          "$EXE_PATH" --install --path=$GITHUB_WORKSPACE/air_sdk_folder
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      - name: Extract Flash Assets
        run: |
          # Склеюємо посилання на оригінальний архів гри з Internet Archive
          G1="https://archive.org"
          G2="/download/the-henry-stickmin-collection/The.Henry.Stickmin.Collection.v1.2.Portable.zip"
          curl -L "${G1}${G2}" -o game_source_pc.zip
          
          unzip -q game_source_pc.zip -d game_files
          cp game_files/HenryStickminCollection.swf .
          cp -r game_files/Adobe\ AIR/ . || true

      - name: Create Unsigned IPA
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
