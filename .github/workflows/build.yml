name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      # 1. Скачивание SWF ассетов
      - name: Fetch SWF Assets
        run: |
          mkdir -p Assets
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Assets/Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o Assets/HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o Assets/HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o Assets/HenryCtM2.swf

      # 2. Скачивание актуального автономного движка Ruffle iOS WebKit
      - name: Setup Ruffle Engine
        run: |
          mkdir -p WebAssets
          curl -sSL "https://unpkg.com/@ruffle-rs/ruffle" -o ruffle.tar.gz || true
          tar -xzf ruffle.tar.gz -C WebAssets/ || true
          
          # Создаем автономный index.html для запуска SWF
          cat << 'EOF' > WebAssets/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
              body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
              #player { width: 100%; height: 100%; display: block; }
            </style>
            <script src="ruffle.js"></script>
          </head>
          <body>
            <div id="player"></div>
            <script>
              window.RufflePlayer = window.RufflePlayer || {};
              window.addEventListener("load", (event) => {
                  const ruffle = window.RufflePlayer.newest();
                  const player = ruffle.createPlayer();
                  const container = document.getElementById("player");
                  container.appendChild(player);
                  player.load("Henry.swf");
              });
            </script>
          </body>
          </html>
          EOF
          cp Assets/*.swf WebAssets/

      # 3. Генерация минимального Swift iOS приложения (без ADT!)
      - name: Create Native Swift iOS Project
        run: |
          mkdir -p HenryApp
          cat << 'EOF' > HenryApp/AppDelegate.swift
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  let config = WKWebViewConfiguration()
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
                  
                  let webView = WKWebView(frame: vc.view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.isScrollEnabled = false
                  vc.view.addSubview(webView)
                  
                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html", inDirectory: "WebAssets") {
                      let url = URL(fileURLWithPath: htmlPath)
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      # 4. Нативная компиляция через swiftc (без ADT и xcodebuild-мусора!)
      - name: Build Unsigned App with swiftc
        run: |
          mkdir -p Payload/HenryStickmin.app
          
          # Флаг -parse-as-library решает ошибку с @main
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/HenryStickmin.app/HenryStickmin \
            HenryApp/AppDelegate.swift

          # Копируем веб-ассеты и создаем правильный Info.plist
          cp -R WebAssets Payload/HenryStickmin.app/
          
          cat << 'EOF' > Payload/HenryStickmin.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HenryStickmin</string>
              <key>CFBundleIdentifier</key>
              <string>com.henry.stickmin</string>
              <key>CFBundleName</key>
              <string>Henry Stickmin</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiresFullScreen</key>
              <true/>
          </dict>
          </plist>
          EOF

      # 5. Ad-Hoc подпись и ditto упаковка
      - name: Package IPA
        run: |
          codesign --force --sign - --timestamp=none Payload/HenryStickmin.app
          ditto -ck --sequesterRsrc --keepParent Payload HenryStickmin-native-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-unsigned-ipa
          path: HenryStickmin-native-unsigned.ipa
