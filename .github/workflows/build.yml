name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download release Files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download Files --repo IHateNumber3/thsc-ios --dir release_files
          ls -la release_files

      - name: Write AppDelegate
        run: |
          mkdir -p Sources
          cat << 'EOF' > Sources/AppDelegate.swift
          import UIKit
          import WebKit

          class AppSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
                  guard let url = urlSchemeTask.request.url else { return }
                  var path = url.path
                  if path == "/" || path.isEmpty { path = "/index.html" }

                  let root = Bundle.main.bundlePath
                  let fm = FileManager.default
                  let candidates = [root + "/WebAssets" + path, root + "/HenryApp" + path, root + path]

                  guard let filePath = candidates.first(where: { fm.fileExists(atPath: $0) }),
                        let data = try? Data(contentsOf: URL(fileURLWithPath: filePath)) else {
                      urlSchemeTask.didFailWithError(URLError(.fileDoesNotExist))
                      return
                  }

                  let mime: String
                  switch (path as NSString).pathExtension.lowercased() {
                  case "html": mime = "text/html"
                  case "js": mime = "text/javascript"
                  case "wasm": mime = "application/wasm"
                  case "swf": mime = "application/x-shockwave-flash"
                  case "json": mime = "application/json"
                  case "txt": mime = "text/plain"
                  default: mime = "application/octet-stream"
                  }

                  let response = HTTPURLResponse(url: url, statusCode: 200, httpVersion: "HTTP/1.1", headerFields: [
                      "Content-Type": mime,
                      "Content-Length": "\(data.count)",
                      "Access-Control-Allow-Origin": "*"
                  ])!
                  urlSchemeTask.didReceive(response)
                  urlSchemeTask.didReceive(data)
                  urlSchemeTask.didFinish()
              }

              func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black

                  let config = WKWebViewConfiguration()
                  config.setURLSchemeHandler(AppSchemeHandler(), forURLScheme: "app")
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.allowsInlineMediaPlayback = true

                  let webView = WKWebView(frame: vc.view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.isScrollEnabled = false
                  webView.isOpaque = false
                  webView.backgroundColor = .black
                  vc.view.addSubview(webView)

                  if let url = URL(string: "app://henry/index.html") {
                      webView.load(URLRequest(url: url))
                  }

                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: HenryStickmin
          options:
            bundleIdPrefix: com.henry
            deploymentTarget:
              iOS: "15.0"
          targets:
            HenryStickmin:
              type: application
              platform: iOS
              sources:
                - path: Sources/AppDelegate.swift
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.henry.stickmin
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_CFBundleDisplayName: "Henry Stickmin"
                INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                INFOPLIST_KEY_UIRequiresFullScreen: YES
                INFOPLIST_KEY_UILaunchScreen_Generation: YES
                INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
          EOF
          xcodegen generate

      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -project HenryStickmin.xcodeproj \
            -scheme HenryStickmin \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Native IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HenryStickmin.app Payload/
          APP=Payload/HenryStickmin.app

          # папки
          mkdir -p "$APP/HenryApp"
          rsync -a --exclude='*.swift*' HenryApp/ "$APP/HenryApp/"
          cp -R WebAssets "$APP/WebAssets"

          # все txt из репо
          cp ./*.txt "$APP/"

          # всё из релиза Files, кроме SDK
          for f in release_files/*; do
            case "$f" in
              *.zip|*.dmg|*.tbz2|*.tar.bz2|*.tar.gz|*[Ss][Dd][Kk]*) echo "skip $f" ;;
              *) cp "$f" "$APP/" ;;
            esac
          done

          ls -la "$APP"

          # проверка: все swf и все txt на месте
          FAIL=0
          for f in release_files/*.swf; do
            [ -f "$APP/$(basename "$f")" ] || { echo "MISSING $(basename "$f")"; FAIL=1; }
          done
          for f in ./*.txt release_files/*.txt; do
            [ -f "$f" ] || continue
            [ -f "$APP/$(basename "$f")" ] || { echo "MISSING $(basename "$f")"; FAIL=1; }
          done
          [ -f "$APP/WebAssets/index.html" ] || { echo "MISSING WebAssets/index.html"; FAIL=1; }
          [ -d "$APP/HenryApp" ] || { echo "MISSING HenryApp"; FAIL=1; }
          [ "$FAIL" = 0 ] || exit 1

          zip -qr HenryStickmin-native.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
