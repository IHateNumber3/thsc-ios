name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # Чистый консольный AIR SDK
      - name: Setup Harman AIR SDK Clean
        run: |
          wget --no-check-certificate "https://archive.org" -O air_sdk.zip
          unzip -q air_sdk.zip -d air_sdk_folder
          echo "$GITHUB_WORKSPACE/air_sdk_folder/bin" >> $GITHUB_PATH

      # Пакуем ВСЕ swf, ВСЕ txt и json файлы из корня репозитория в одну кучу внутри .app
      - name: Packaging iOS App
        run: |
          ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf \
            HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json 2>/dev/null || ./air_sdk_folder/bin/adt -package -target ipa-test-interpreter HenryStickmin.ipa HenryStickmin-app.xml Henry.swf
            
      - name: Distribute Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
