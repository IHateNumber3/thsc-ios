name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем AIRSDK_MacOS.zip из твоих релизов и настраиваем по мануалу
      - name: Setup AIR SDK
        run: |
          mkdir -p ~/sdks/air
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          # Скачиваем официальный AIRSDK_MacOS.zip
          curl -sSL --fail "$BASE_URL/AIRSDK_MacOS.zip" -o ~/Downloads/AIRSDK_MacOS.zip
          
          # Распаковываем
          unzip -q ~/Downloads/AIRSDK_MacOS.zip -d ~/sdks/air
          
          # Снимаем карантин macOS (как в инструкции)
          xattr -r -d com.apple.quarantine ~/sdks/air || true
          
          # Проставляем права на выполнение
          chmod -R +x ~/sdks/air/bin
          
          # Добавляем AIR_HOME и PATH в окружение GitHub Actions
          echo "AIR_HOME=$HOME/sdks/air" >> $GITHUB_ENV
          echo "$HOME/sdks/air/bin" >> $GITHUB_PATH
          
          echo "AIR SDK configured successfully!"

      # Шаг 2: Проверяем версию adt (как в инструкции)
      - name: Verify ADT
        run: |
          adt -version

      # Шаг 3: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 4: Упаковка приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      # Шаг 5: Сохранение артефакта
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
