name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем готовый автономный AIR SDK напрямую с GitHub Releases
      - name: Download Harman AIR SDK
        run: |
          mkdir -p air_sdk
          
          # Забираем проверенный сборник AIR SDK
          curl -sSL -L "https://github.com/airframework/air-sdk-releases/releases/download/v50.2.3.1/AIRSDK_Compiler.zip" -o air_sdk.zip
          
          unzip -q air_sdk.zip -d air_sdk
          
          # Ищем adt и заносим в PATH
          ADT_PATH=$(find "$GITHUB_WORKSPACE/air_sdk" -name "adt" -type f | head -n 1)
          
          if [ -n "$ADT_PATH" ]; then
            ADT_DIR=$(dirname "$ADT_PATH")
            chmod -R +x "$ADT_DIR"
            echo "$ADT_DIR" >> $GITHUB_PATH
            echo "ADT successfully found at: $ADT_PATH"
          else
            echo "ADT not found in extracted archive"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      # Шаг 4: Сохраняем готовую IPA в артефакты
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
