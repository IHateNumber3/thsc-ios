name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Разворачиваем рабочий Apache Flex SDK
      - name: Download & Setup Apache Flex SDK
        run: |
          mkdir -p air_sdk_folder
          
          # Скачиваем твой проверенный рабочий ZIP
          curl -sSL "https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip" -o flex_sdk.zip
          
          unzip -q flex_sdk.zip -d air_sdk_folder
          
          # Находим папку bin внутри распакованного SDK
          BIN_DIR=$(find "$GITHUB_WORKSPACE/air_sdk_folder" -type d -name "bin" | head -n 1)
          
          if [ -n "$BIN_DIR" ]; then
            chmod -R +x "$BIN_DIR"
            echo "$BIN_DIR" >> $GITHUB_PATH
            echo "Flex SDK bin added to PATH: $BIN_DIR"
          else
            echo "bin directory not found"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
