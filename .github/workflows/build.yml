name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Крок 1: Встановлення AIR SDK
      - name: Setup AIR SDK
        run: |
          mkdir -p ~/sdks/air
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/AIRSDK_MacOS.zip" -o ~/Downloads/AIRSDK_MacOS.zip
          unzip -q ~/Downloads/AIRSDK_MacOS.zip -d ~/sdks/air
          
          xattr -r -d com.apple.quarantine ~/sdks/air || true
          chmod -R +x ~/sdks/air/bin
          
          echo "AIR_HOME=$HOME/sdks/air" >> $GITHUB_ENV
          echo "$HOME/sdks/air/bin" >> $GITHUB_PATH

      # Крок 2: Перевірка ADT
      - name: Verify ADT
        run: |
          adt -version

      # Крок 3: Завантаження SWF файлів
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf

      # Крок 4: Пакування симулятора для збору структури файлів
      - name: Package Base IPA
        run: |
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          
          adt -certificate -cn DummyCert 2048-RSA dummy.pfx certpassword

          adt -package \
            -target ipa-test-interpreter-simulator \
            -storetype pkcs12 \
            -keystore dummy.pfx \
            -storepass certpassword \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            -platformsdk "$SIM_SDK_PATH" \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt

      # Крок 5: Заміна симуляторного x86 бинарника на справжній ARM64 runner та ad-hoc підпис
      - name: Replace Executable with ARM64 Runner
        run: |
          unzip -q HenryStickmin.ipa -d temp_extract
          
          rm -rf Payload HenryStickmin.ipa
          mkdir -p Payload
          mv temp_extract/Payload/HenryStickmin.app Payload/
          rm -rf temp_extract

          APP_DIR="Payload/HenryStickmin.app"
          
          # Знаходимо чесний 64-бітний ARM64 інтерпретатор для iOS усередині AIR SDK
          ARM64_RUNNER=$(find "$AIR_HOME" -name "CTAIRInterpreter" -exec file {} \; | grep -i "arm64" | cut -d: -f1 | head -n 1)
          
          if [ -z "$ARM64_RUNNER" ]; then
            # Якщо окремий файл не знайдено, беремо універсальний рантайм
            ARM64_RUNNER=$(find "$AIR_HOME" -path "*/runtimes/air/ios/*" -name "CTAIRInterpreter" | head -n 1)
          fi

          echo "Found ARM64 AIR Runner: $ARM64_RUNNER"

          # Підміняємо бінарник HenryStickmin на ARM64 версію
          cp -f "$ARM64_RUNNER" "$APP_DIR/HenryStickmin"
          chmod +x "$APP_DIR/HenryStickmin"

          # Ad-hoc підпис Apple через codesign (як у джерелі Source Engine)
          echo "=== Ad-hoc codesigning ==="
          find "$APP_DIR" -name "*.dylib" -exec codesign --force --sign - --timestamp=none {} \; || true
          codesign --force --sign - --timestamp=none "$APP_DIR"

          echo "=== Zipping IPA via ditto ==="
          ditto -ck --sequesterRsrc --keepParent Payload HenryStickmin.ipa
          
          ls -lh HenryStickmin.ipa

      # Крок 6: Вивантаження IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
