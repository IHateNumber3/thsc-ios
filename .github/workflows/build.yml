name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  compile-game:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Setup Node.js (For downloading SDK)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Install AIR SDK via NPM
        run: |
          npm install -g airsdk
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Fetch Flash Assets via CLI
        run: |
          npm install -g archive-cli-tool || npm install -g @archiveorg/cli || true
          # Використовуємо чисту завантажувальну команду без лінків
          npx asari-cli download-item the-henry-stickmin-collection --file=The.Henry.Stickmin.Collection.v1.2.Portable.zip || \
          curl -sL "https://wtt.biz" -o HenryStickminCollection.swf

      - name: Java Setup
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Create Unsigned IPA
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            HenryStickminCollection.swf

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
