name: Super Henry Port iOS

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 1: Скачиваем DMG airsdkmanager, монтируем и устанавливаем AIR SDK
      - name: Install Harman AIR SDK via Manager DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Скачиваем DMG из официальных релизов Harman airsdkmanager
          gh release download --repo airsdk/airsdkmanager-releases --pattern "*mac*.dmg" --clobber
          
          # 2. Монтируем DMG образ
          DMG_FILE=$(ls *.dmg | head -n 1)
          hdiutil attach "$DMG_FILE" -mountpoint /Volumes/AIRSDKManager
          
          # 3. Находим исполняемый файл бинарника airsdkmanager
          MGR_BIN=$(find /Volumes/AIRSDKManager -type f -name "airsdkmanager" | head -n 1)
          
          if [ -z "$MGR_BIN" ]; then
            # Если бинарник лежит внутри .app бандла
            MGR_BIN=$(find /Volumes/AIRSDKManager -path "*/Contents/MacOS/*" -type f | head -n 1)
          fi
          
          echo "Found manager at: $MGR_BIN"
          
          # 4. Скачиваем полноценный AIR SDK в рабочую папку
          mkdir -p "$GITHUB_WORKSPACE/air_sdk_folder"
          "$MGR_BIN" --install 51.1.1.5 --path "$GITHUB_WORKSPACE/air_sdk_folder" --license-agree || true
          
          # 5. Размонтируем DMG
          hdiutil detach /Volumes/AIRSDKManager || true
          
          # 6. Проверяем, что adt на месте, и прописываем в PATH
          ADT_PATH=$(find "$GITHUB_WORKSPACE/air_sdk_folder" -name "adt" -type f | head -n 1)
          if [ -n "$ADT_PATH" ]; then
            chmod -R +x "$(dirname "$ADT_PATH")"
            echo "$(dirname "$ADT_PATH")" >> $GITHUB_PATH
          else
            echo "Failed to install AIR SDK via manager"
            exit 1
          fi

      # Шаг 2: Скачиваем SWF ассеты из релиза Files
      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          
          curl -sSL --fail "$BASE_URL/Henry.swf" -o Henry.swf
          curl -sSL --fail "$BASE_URL/HenryFtC.swf" -o HenryFtC.swf
          curl -sSL --fail "$BASE_URL/HenryCtM.swf" -o HenryCtM.swf
          curl -sSL --fail "$BASE_URL/HenryCtM2.swf" -o HenryCtM2.swf
          
          ls -lh *.swf

      # Шаг 3: Упаковка iOS приложения в .ipa
      - name: Package iOS App
        run: |
          adt -package -target ipa-test-interpreter \
            HenryStickmin.ipa \
            HenryStickmin-app.xml \
            Henry.swf HenryFtC.swf HenryCtM.swf HenryCtM2.swf *.txt *.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-unsigned-ipa
          path: HenryStickmin.ipa
          if-no-files-found: error
