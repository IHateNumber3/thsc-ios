name: Build Henry Stickmin Native iOS

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch SWF Assets
        run: |
          BASE_URL="https://github.com/IHateNumber3/thsc-ios/releases/download/Files"
          for f in Henry HenryFtC HenryCtM HenryCtM2; do
            curl -sSL --fail "$BASE_URL/$f.swf" -o "WebAssets/$f.swf"
          done

      - name: Fix AppDelegate filename
        run: |
          for f in HenryApp/AppDelegate.swift*; do
            [ "$f" != "HenryApp/AppDelegate.swift" ] && mv "$f" HenryApp/AppDelegate.swift
          done
          ls -la HenryApp WebAssets

      - name: Stage HenryApp folder without swift
        run: |
          mkdir -p Staging/HenryApp
          rsync -a --exclude='*.swift*' HenryApp/ Staging/HenryApp/
          touch Staging/HenryApp/.keep
          ls -la Staging/HenryApp

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: HenryStickmin
          options:
            bundleIdPrefix: com.henry
            deploymentTarget:
              iOS: "15.0"
          targets:
            HenryStickmin:
              type: application
              platform: iOS
              sources:
                - path: HenryApp/AppDelegate.swift
              resources:
                - path: Staging/HenryApp
                  type: folder
                - path: WebAssets
                  type: folder
                - path: btb_english.txt
                - path: ctm_english.txt
                - path: etp_english.txt
                - path: ftc_english.txt
                - path: ita_english.txt
                - path: std_english.txt
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.henry.stickmin
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_CFBundleDisplayName: "Henry Stickmin"
                INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                INFOPLIST_KEY_UIRequiresFullScreen: YES
                INFOPLIST_KEY_UILaunchScreen_Generation: YES
                INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
          EOF
          xcodegen generate

      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -project HenryStickmin.xcodeproj \
            -scheme HenryStickmin \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Native IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HenryStickmin.app Payload/
          ls -la Payload/HenryStickmin.app
          zip -qr HenryStickmin-native.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HenryStickmin-native-ipa
          path: HenryStickmin-native.ipa
